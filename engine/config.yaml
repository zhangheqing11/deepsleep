# 会谈引擎冻结配置（AGENTS.md §2：演示时冻结，现场不改）。相对路径相对本文件。
schema_version: "0.1.0"
playbook_path: playbook_v0.md
prompts_dir: prompts

agent_llm:
  provider: ds_flash          # ds_flash | mock；缺 DS_* 时自动回退 mock 并在 models.agent 标 mock(fallback)
  temperature: 0
  top_p: 1
  max_tokens: 1600
  max_tokens_by_task:
    plan: 3200
    strategy: 1600
    turn: 2200
    response: 1200
    memory: 1800
    select: 1200
  truncation_retry_multiplier: 2
  response_format: json_object
  timeout_s: 20
  max_retries: 2              # 解析失败或请求异常时重试次数（事先写死，不靠人工）
  max_inflight: 32            # 全进程同时在途的 agent LLM 请求上限

# 环 1 路径分类器（冻结，不参与进化）；缺 key 回退 mock 并在 trace 标 mock(fallback)
path_classifier:
  provider: ds_flash          # ds_flash | jev | mock
  timeout_s: 6
  temperature: 0

# 环 1 子智能体：true = 策略生成 + 回复生成合并成一次调用（比较延迟用，团队定后冻结）
pipeline:
  merge_strategy_response: false

# C4：每轮 agent 动作上限（发言与筛查工具调用都占一个回合）；收尾处方消息不计入。
round_turn_cap:
  1: 5
  2: 4

concurrency:
  max_sessions: 50            # 同时进行的会谈数

# 给来访的收尾消息与 agent 发言命中 domain/vetoes 硬否决时，最多让 agent 重写的次数
veto_rewrite_attempts: 1
