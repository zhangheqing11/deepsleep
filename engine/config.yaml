# 会谈引擎冻结配置（AGENTS.md §2：演示时冻结，现场不改）。相对路径相对本文件。
schema_version: "0.1.0"
playbook_path: playbook_v1.md
prompts_dir: prompts
visitor_renderer: llm        # llm | template; S2 template never calls a visitor LLM

agent_llm:
  provider: ds_flash          # ds_flash | mock；缺 DS_* 时自动回退 mock 并在 models.agent 标 mock(fallback)
  temperature: 0
  top_p: 1
  max_tokens: 1600
  thinking: disabled         # DeepSeek Chat Completions thinking.type (verified with live API)
  thinking_by_task:
    plan: high
    memory_plan: high
  max_tokens_by_task:
    plan: 3200
    memory_plan: 4000
    strategy: 1600
    turn: 2200
    response: 1200
    memory: 1800
    select: 1200
  truncation_retry_multiplier: 2
  response_format: json_object
  timeout_s: 20
  max_retries: 2              # 解析失败或请求异常时重试次数（事先写死，不靠人工）
  network_retry:
    max_retries: 2
    backoff_s: 0.5
    max_backoff_s: 2.0
    rate_limit_retries: 5      # 服务商限流（HTTP 429）单独的重试预算；其他状态码不重试
    rate_limit_backoff_s: 1.0  # 指数退避起点，带抖动，避免并发会谈同步重试
    rate_limit_max_backoff_s: 8.0
  max_inflight: 192           # 全进程同时在途的 agent LLM 请求上限（11/14 夜实测：三批并行约 170 在途，0 错误）

# 环 1 路径分类器（冻结，不参与进化）；缺 key 回退 mock 并在 trace 标 mock(fallback)
path_classifier:
  provider: ds_flash          # 11/15 凌晨冻结为 ds flash：进化与留出验证全部在它上面完成，且不依赖境外网络。
                              # 可选 jev（Jev -> ds flash 自动降级）：单场快约 9 秒，主指标无差别，但需美国出口且未在新流程下验证
  timeout_s: 6
  temperature: 0
  thinking: disabled

# 环 1 子智能体：true = 策略生成 + 回复生成合并成一次调用（比较延迟用，团队定后冻结）
pipeline:
  merge_strategy_response: true
  merge_memory_plan: true

# C4：每轮 agent 动作上限；主动筛查占一次，D4 强制筛查与收尾消息不计入。
round_turn_cap:
  1: 4
  2: 3

concurrency:
  max_sessions: 50            # 同时进行的会谈数

# 给来访的收尾消息与 agent 发言命中 domain/vetoes 硬否决时，最多让 agent 重写的次数
veto_rewrite_attempts: 1

# 批次有效性（事先冻结，自动触发）：服务商限流/欠费（HTTP 429/402）时会谈会退回确定性兜底话术，
# 整批仍能算出分数却不再衡量 playbook。降级会谈占比超过此值的批次判为无效：
# 运行 1/2 直接停下等待重跑；学习中的验证批次记为该候选验证失败。
quality:
  max_degraded_share: 0.10    # degraded_sessions / attempted 的上限，取值 [0, 1]
