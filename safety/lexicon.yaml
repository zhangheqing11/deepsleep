# 已定（11/14）；来源 ds-clinical/safety/crisis_lexicon_draft.md。X9 仅提示，past_time 仅改道。
explicit:
- id: E1
  pattern: (?<![不没别未])(?<![不没别未][有会是要想能])(?:想|要|准备|打算|决定|计划|考虑|试图|想过|试过|尝试)[^，。！？!?,.\s]{0,3}?(?:自杀|轻生|寻死|寻短见|自尽|结束(?:自己的|我的)?(?:生命|性命)|了结(?:自己的生命|自己|生命)|了断(?:自己|生命))
  example: 我真的想结束自己的生命
  level: active
- id: E2
  pattern: (?<![不没未])有(?:过|着|了)?[^，。！？!?,.\s]{0,3}(?:自杀|轻生|寻死|结束生命|结束自己的生命|了结自己)(?:的)?(?:念头|想法|冲动|倾向|打算|计划)
  example: 最近有过自杀的想法
  level: active
- id: E3
  pattern: (?<![不没未])(?:写|留|立|备|准备)(?:好|了|下|过){0,2}(?:一封|一份)?(?:遗书|遗嘱|遗言)
  example: 我已经写好了遗书
  level: active
- id: E4
  pattern: 我(?!朋友|室友|同事|同学|家人|妈|爸|哥|姐|弟|妹|老公|老婆|对象|邻居|孩子)[^。！？!?\n]{0,10}?(?:跳楼|跳河|跳桥|上吊|割腕|割脉|烧炭|服毒|喝农药|开煤气|从(?:阳台|楼顶|天台|窗户|桥上|楼上)跳)
  example: 我想从阳台跳下去
  level: active
- id: E5
  pattern: 我(?!朋友|室友|同事|同学|家人|妈|爸|哥|姐|弟|妹|老公|老婆|对象|邻居|孩子)[^。！？!?\n]{0,10}?(?:安眠药|褪黑素|药片|药)[^。！？!?\n]{0,8}?(?:全部|全都|一次性|一整瓶|一把)[^。！？!?\n]{0,6}?(?:吃|吞|服)
  example: 我打算把安眠药一次性全吃了
  level: active
- id: E6
  pattern: (?:(?:拿|用)(?:了)?(?:刀|刀片|美工刀|剪刀|玻璃)[^。！？!?\n]{0,6}?(?:手腕|手臂|胳膊|大腿|脖子))|(?<![不没未])割(?:了|过)?(?:手腕|腕|脉|手臂)
  example: 我拿刀片在手腕上划了一下
  level: active
- id: E7
  pattern: 我(?!朋友|室友|同事|同学|家人|妈|爸|哥|姐|弟|妹|老公|老婆|对象|邻居|孩子)[^。！？!?\n]{0,6}?(?:今晚|今天|明天|这周|周末)[^。！？!?\n]{0,8}?(?:去死|自杀|轻生|结束(?:自己的)?生命|了结自己|了断)
  example: 我明天就去自杀
  level: active
ambiguous:
- id: M0
  pattern: 死
  example: 我是不是快死了
- id: M1
  pattern: 不想(?:再)?活|不想活下去|活够了|活着(?:好)?(?:没(?:什么)?(?:意思|意义|劲|必要)|累|辛苦|痛苦)|活不下去|不如死|死了算了|想去世|想长眠|想消失|不如消失|消失算了|消失吧|想不开
  example: 最近觉得活着没意思
- id: M2a
  pattern: (?:不想|不愿|不要|别|不用)(?:再)?(?:醒|睁眼|睁开眼|起床)
  example: 好想睡着就不要再醒
- id: M2b
  pattern: 希望[^。！？!?\n]{0,6}(?:不要|别)(?:再)?(?:醒|睁眼)
  example: 希望明天不要再醒来
- id: M2c
  pattern: 醒不过来|醒不来|一睡不起|长睡不醒|永远(?:不醒|睡下去|睡着|睡过去)|睡(?:过)?去(?:了)?(?:就|算了|不再|别)|一直睡下去|长眠|永眠|怕(?:天亮|醒过来|醒来)|还活着
  example: 真想一直睡下去
- id: M3
  pattern: 没我的话|没有我的话|如果我不在|要是我不在|我不在了|少我一个|是(?:个)?累赘|是(?:个)?负担|拖累(?:大家|家人|别人|父母|他们)
  example: 我觉得自己是个累赘
- id: M4
  pattern: 解脱|撑不下去|熬不下去|坚持不下去|一了百了|结束(?:这一切|一切|自己)|了结|了断
  example: 我只想早点解脱
- id: M5a
  pattern: 自杀|轻生|自尽|寻短见|自残|自伤|割腕|割脉|跳楼|跳下去|上吊|烧炭|服毒|农药|煤气|遗书|遗嘱|遗言|后事|致死量|药量
  example: 看到新闻说有人自杀了
- id: M5b
  pattern: (?:攒|囤|存|数|买)[^，。！？!?\n]{0,4}(?:安眠药|药片|药)|吃[^，。！？!?\n]{0,6}(?:多少|几).{0,4}(?:会死|致命|没命|有危险)|(?:多少|几)(?:片|粒|颗|瓶).{0,8}(?:会死|致命|没命|有危险|醒不过来)
  example: 我最近一直在囤安眠药
- id: M6
  pattern: (?:阳台|楼顶|天台|窗边|窗台|桥上|铁轨)[^。！？!?\n]{0,10}(?:站|待|坐|爬)[^。！？!?\n]{0,10}(?:跳|下去|掉下)
  example: 我老在天台边上待着，总想着跳下去
- id: M7
  pattern: 没(?:有)?(?:希望|未来|出路|明天|意义)|看不到(?:希望|未来|头)|没救了|没什么(?:盼头|意义)
  example: 我觉得没希望了
- id: M8
  pattern: (?:跟|和|给).{0,6}(?:告别|道别)|道别|永别|交代后事|交待后事|最后一次(?:见|跟|和)
  example: 我想跟你们道别
exclude:
- id: X1
  pattern: '[困累饿热冷急烦吵气笑馋忙渴冻撑闷懒羞吓怕蠢痒酸麻辣苦甜咸臭香丑美爽]死(?:了|我了|我啦|人了|啦|人|个人|爹|妈|宝宝了)?'
  example: 困死了
- id: X2
  pattern: 得(?:我|人)?(?:要|快|半)死|半死
  example: 困得要死
- id: X3
  pattern: 想死(?:你们|大家|宝贝|你|他|她|它)了?|想死我了?
  example: 想死你了
- id: X4
  pattern: 死(?:活|党|机|磕|心|板|胡同|循环|线|脑筋|皮赖脸|对头|鬼|猪|结|角|水|气沉沉|不承认|不认|命|盯|咬|撑|扛|守|等|定|扣|缠)|死去活来|你死我活
  example: 这生物钟死活调不过来
- id: X5
  pattern: (?:要|快|怕|会|差点|感觉|觉得|担心).{0,3}猝死
  example: 感觉要猝死了
- id: X6
  pattern: (?:像|跟|如同|仿佛|好比)[^，。！？!?\n]{0,2}(?:死人|死猪|尸体|僵尸)|(?:死人|死猪)(?:一样|似的|般)|睡得(?:像|跟)死
  example: 像个死人一样躺着
- id: X7
  pattern: (?:你|他|她|它|你们|他们)(?:怎么不|给我|就)?去死
  example: 你们怎么不去死
- id: X8
  pattern: '[困累饿].{0,3}(?:撑不下去|熬不下去|撑不住|熬不住|坚持不下去)'
  example: 困得撑不下去了
- id: X9
  pattern: 赖床|补觉|被窝|被子|再睡(?:一会|会儿|五分钟|十分钟|几分钟|一觉|个回笼觉)|回笼觉|睡到(?:自然醒|中午|下午|十点|十二点)|闹钟|起床气|周末|假期|休息日|放假|上班|上学|上课|早八|好的?梦|美梦
  example: 周末真不想醒
  context_hint: 赖床/补觉语境
past_time:
- id: PT1
  pattern: 以前|从前|那时候|那时|当时
  example: 以前
- id: PT2
  pattern: (?:小学|初中|高中|大学)(?:的时候|时|那阵子|那时候)
  example: 高中的时候
- id: PT3
  pattern: (?:多|几|[一二两三四五六七八九十百\d]+)年前
  example: 多年前
- id: PT4
  pattern: 早就(?:不|没)|早已(?:不|没)
  example: 早就不这样了
