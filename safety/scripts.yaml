# 占位，待心理学同学审定后替换
history_check: '我想确认一下，现在你已经没有这种念头，也没有伤害自己的想法或行为了吗？'
# 仅检查核验措辞，不能替代对语义与正式话术的人工审定。
history_verify_patterns:
  - '(?:现在|目前|此刻|最近|近一个月|近 1 个月)[^。！？；\n]{0,60}(?:是否|有没有|还会|还想|仍有|还有|已经没有)[^。！？；\n]{0,40}(?:这种念头|这些念头|这样的念头|轻生|自杀|自伤|伤害自己|不想活|不再醒来)[^。！？；\n]{0,20}(?:吗|么|[？?])'
  - '(?:现在|目前|此刻|最近|近一个月|近 1 个月)[^。！？；\n]{0,40}(?:轻生|自杀|自伤|伤害自己|不想活|不再醒来|这种念头|这些念头|这样的念头)[^。！？；\n]{0,30}(?:还有吗|还在吗|仍然存在吗|是否仍有|有没有|吗[？?])'
safety_check: '我想先确认你的安全：你现在是否有伤害自己的想法，或已经做了准备？'
crisis_protocol: |-
  我很关心你此刻的安全。我们先暂停睡眠建议。
  请先远离可能伤害自己的物品，联系能陪伴你的可信任的人。
  如果你已受伤或可能马上采取行动，请立即联系当地紧急救援或前往急诊。
  求助资源：{hotlines}
hotlines:
  - name: 当地紧急救援（占位）
    number: 待核验
    hours: 待核验
    verified: false
  - name: 当地心理支持热线（占位）
    number: 待核验
    hours: 待核验
    verified: false
  - name: 当地危机援助资源（占位）
    number: 待核验
    hours: 待核验
    verified: false
