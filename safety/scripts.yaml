# 定稿（心理学同学 2026-11-14 审定，采用推荐版）。热线已由心理学同学 2026-11-14 实测，verified: true；每次演示前仍要复核。
history_check: 谢谢你愿意说出来，这不容易，我只想确认现在的情况：最近一个月，你还有没有这样的念头，或者伤害自己的行为？
# 问句内逐小句核验：风险与疑问形式须同小句，时间可来自同句前文；排除回避核验。
history_verify_patterns:
  risk: '(?:这种|这样的?|这些|那种|这类|那样的?|自杀的?|轻生的?|自伤的?|想死的?|伤害自己的?|结束(?:生命|自己)的?)(?:念头|想法)|想死|轻生|自杀|自伤|伤害自己|不想活|不再醒来'
  question: '有没有|是否|吗|么|还有|仍有|还在|是不是|[？?]'
  time: '现在|目前|此刻|仍|还|最近|近一个月|近\s*1\s*个月'
  avoidance: '(不用|不必|无需|不要|不需要|没必要|不能|不会|别|不想|不打算|避免|禁止|不再)(再|继续)?(问|确认|核验|询问|谈)'
safety_check: 听起来你现在很不好受。我想先确认一下：你现在安全吗，有没有想过伤害自己，比如已经想好怎么做，或者准备了什么？
crisis_protocol: '我很担心你，先把睡眠的事放一放，你现在的安全最要紧。

  请把可能伤到自己的东西放远，马上联系身边信得过的人，请他来陪你。

  如果已经受伤或马上要伤害自己，请立刻打 120 或 110。

  求助电话：

  {hotlines}

  等你安全了，随时回来接着聊睡眠。'
hotlines:
- name: 全国统一心理援助热线
  number: '12356'
  verified: true
- name: 北京心理援助热线
  number: 010-82951332（手机）/ 800-810-1117（座机）
  verified: true
